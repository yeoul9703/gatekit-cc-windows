[project]
name = "gatekit"
version = "0.1.0"
description = "Gate harness for Claude Code (Windows + uv). Standard library only at runtime."
requires-python = ">=3.11"
dependencies = []

[tool.uv]
# Not an installable package: bin/gatekit.py is run with the project venv's
# python. No build backend, no entry-point script.
package = false

[dependency-groups]
dev = [
    "pyright[nodejs]>=1.1.400,<2",
    "ruff>=0.16,<0.17",
]

[tool.pyright]
include = ["gatekit"]
pythonVersion = "3.11"
pythonPlatform = "Windows"
typeCheckingMode = "basic"

[tool.ruff]
target-version = "py311"

[tool.ruff.lint]
# Explicit set (ruff 0.16 default is ~413 rules): the pre-0.16 default plus bugbear.
select = ["E4", "E7", "E9", "F", "B"]
ignore = ["E741"]
