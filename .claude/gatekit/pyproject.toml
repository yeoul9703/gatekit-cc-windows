[project]
name = "gatekit"
version = "0.1.0"
description = "Gate harness for Claude Code (Windows + uv). Standard library only at runtime."
requires-python = ">=3.14"
dependencies = []

[tool.uv]
# Not an installable package: bin/gatekit.py is run with the project venv's
# python. No build backend, no entry-point script.
package = false
# No group is installed by default: `uv run --frozen` (what every command uses)
# must not download pyright and ruff on a user's machine. scripts/verify.ps1
# asks for them with `--group dev`.
default-groups = []

[dependency-groups]
dev = [
    "pyright[nodejs]>=1.1.400,<2",
    "ruff>=0.16,<0.17",
]

[tool.pyright]
include = ["gatekit"]
pythonVersion = "3.14"
pythonPlatform = "Windows"
typeCheckingMode = "basic"

[tool.ruff]
target-version = "py314"

[tool.ruff.lint]
# Explicit set (ruff 0.16 default is ~413 rules): the pre-0.16 default plus bugbear.
select = ["E4", "E7", "E9", "F", "B"]
ignore = ["E741"]
